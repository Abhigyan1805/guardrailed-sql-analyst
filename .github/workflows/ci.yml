name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run db:seed
      # Guard, auth, rate-limit and execution tests; none need an LLM key.
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: gsa:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the container
        run: |
          docker run -d --name gsa -p 3000:3000 -e AUTH_SECRET=ci -e ALLOW_MOCK_AUTH=true gsa:ci
          for i in $(seq 1 30); do curl -sf localhost:3000/api/health && break || sleep 2; done
          TOKEN=$(curl -sf -XPOST localhost:3000/api/auth/token -H 'content-type: application/json' -d '{"tenant":"tenant_a"}' | jq -r .token)
          curl -sf -XPOST localhost:3000/api/query -H "x-ctx-token: $TOKEN" -d '{"question":"Top 5 products by revenue"}' | jq -e '.decision=="ALLOW"'
          curl -s -XPOST localhost:3000/api/query -H "x-ctx-token: $TOKEN" -d '{"question":"Delete all orders"}' | jq -e '.decision=="BLOCK"'

  # Skips (not fails) until the Azure secrets exist; see README "Deploy to Azure".
  check-azure:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.c.outputs.configured }}
    steps:
      - id: c
        env:
          CID: ${{ secrets.AZURE_CLIENT_ID }}
          AS: ${{ secrets.AUTH_SECRET }}
        run: echo "configured=$([ -n "$CID" ] && [ -n "$AS" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [test, docker, check-azure]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.check-azure.outputs.configured == 'true'
    runs-on: ubuntu-latest
    concurrency: deploy
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: img
        run: |
          echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ steps.img.outputs.ref }}
            ghcr.io/${{ steps.img.outputs.repo }}:latest
          cache-from: type=gha
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy infra and new revision
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: ./infra/deploy.sh "${{ steps.img.outputs.ref }}"

  # Optional: mirror to a Hugging Face Docker Space. Skips cleanly without HF_TOKEN / HF_SPACE.
  check-hf:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.c.outputs.configured }}
    steps:
      - id: c
        env:
          T: ${{ secrets.HF_TOKEN }}
          S: ${{ vars.HF_SPACE }}
        run: echo "configured=$([ -n "$T" ] && [ -n "$S" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  deploy-hf:
    needs: [test, docker, check-hf]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.check-hf.outputs.configured == 'true'
    runs-on: ubuntu-latest
    concurrency: deploy-hf
    steps:
      - uses: actions/checkout@v4
      - run: pip install huggingface_hub
      - env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
          HF: hf
        run: ./infra/hf-space.sh
