name: eval
on:
  push:
    paths: ['lib/**', 'db/**', 'eval/**', 'scripts/**']
  pull_request:
    paths: ['lib/**', 'db/**', 'eval/**', 'scripts/**']
  schedule: [{ cron: '0 6 * * *' }]
  workflow_dispatch:

# PR/push gates stay deterministic and cheap: unit tests, gold validation,
# dev x templates, and the real-Postgres security suite. Held-out and paraphrase
# never run on a PR (R2): that is how a held-out set quietly becomes a second dev
# set. The full matrix runs nightly.
jobs:
  eval:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shop
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Accuracy/LLM/calibration fixture stays on PGlite (embedded, no service).
      # No DATABASE_URL here, so the seed targets the PGlite data dir.
      - run: npm run db:seed
      - run: npx vitest run
      - run: npx tsx scripts/validate-golds.ts
      # Regression gate: dev x templates (deterministic, no model credentials).
      # --strict applies the per-engine latency ceiling and the dev/templates
      # accuracy floor; heldout/paraphrase stay nightly/manual (R2).
      - run: npx tsx eval/runner.ts --set dev --engine templates --strict
      # Security suite runs against real Postgres: PGlite silently ignores
      # statement_timeout and cannot exercise filesystem/network exposure.
      - name: Seed real Postgres
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shop
        run: npm run db:seed
      - name: "Attacks suite (hard gate: zero executed violations)"
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shop
        run: npx tsx scripts/attacks.ts --strict
      - name: Defense-in-depth ablation matrix
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shop
        run: npx tsx scripts/ablate-layer.ts
      - name: Regenerate eval/SECURITY.md from measured results
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shop
        run: npx tsx scripts/security-report.ts
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            eval/REPORT.md
            eval/SECURITY.md
            eval/security-results.json
            eval/ablation-results.json

  # Nightly full matrix: every set x every engine, --repeats 3 for LLM engines.
  # Needs a model credential for the LLM/hybrid engines; without it the job
  # skips cleanly instead of clobbering the committed reports with templates only.
  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Materialize model credentials
        id: auth
        env:
          OPENCODE_AUTH_JSON: ${{ secrets.OPENCODE_AUTH_JSON }}
        run: |
          if [ -n "$OPENCODE_AUTH_JSON" ]; then
            mkdir -p "$HOME/.local/share/opencode"
            printf '%s' "$OPENCODE_AUTH_JSON" > "$HOME/.local/share/opencode/auth.json"
            echo "has_auth=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_auth=false" >> "$GITHUB_OUTPUT"
            echo "::warning::OPENCODE_AUTH_JSON is not set; skipping the nightly LLM matrix"
          fi
      - name: Seed embedded Postgres
        if: steps.auth.outputs.has_auth == 'true'
        run: npm run db:seed
      - name: Full matrix (all sets x all engines, --strict per-engine gates)
        if: steps.auth.outputs.has_auth == 'true'
        run: npx tsx eval/runner.ts --matrix --strict
      - name: Upload reports
        if: steps.auth.outputs.has_auth == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nightly-eval
          path: |
            eval/reports/**
            eval/REPORT.md
            eval/CALIBRATION.md
      - name: Commit refreshed reports
        if: steps.auth.outputs.has_auth == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eval/reports eval/REPORT.md eval/CALIBRATION.md
          if git diff --cached --quiet; then
            echo "no report changes"
          else
            git commit -m "Nightly eval matrix"
            git push
          fi
