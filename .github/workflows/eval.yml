name: eval
on:
  push:
    paths: ['lib/**', 'db/**', 'eval/**', 'scripts/**']
  pull_request:
    paths: ['lib/**', 'db/**', 'eval/**', 'scripts/**']
  schedule: [{ cron: '0 6 * * *' }]
  workflow_dispatch:

# PR/push gates stay deterministic and cheap: unit tests, gold validation,
# dev x templates, and the real-Postgres security suite. Held-out and paraphrase
# never run on a PR (R2): that is how a held-out set quietly becomes a second dev
# set. The full matrix runs nightly.
jobs:
  eval:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shop
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Accuracy/LLM/calibration fixture stays on PGlite (embedded, no service).
      # No DATABASE_URL here, so the seed targets the PGlite data dir.
      - run: npm run db:seed
      - run: npx vitest run
      - run: npx tsx scripts/validate-golds.ts
      # Regression gate: dev x templates (deterministic, no model credentials).
      # --strict applies the per-engine latency ceiling and the dev/templates
      # accuracy floor; heldout/paraphrase stay nightly/manual (R2).
      - run: npx tsx eval/runner.ts --set dev --engine templates --strict
      # Security suite runs against real Postgres: PGlite silently ignores
      # statement_timeout and cannot exercise filesystem/network exposure.
      - name: Seed real Postgres
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shop
        run: npm run db:seed
      - name: "Attacks suite (hard gate: zero executed violations)"
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shop
        run: npx tsx scripts/attacks.ts --strict
      - name: Defense-in-depth ablation matrix
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shop
        run: npx tsx scripts/ablate-layer.ts
      - name: Regenerate eval/SECURITY.md from measured results
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shop
        run: npx tsx scripts/security-report.ts
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            eval/REPORT.md
            eval/SECURITY.md
            eval/security-results.json
            eval/ablation-results.json

  # Nightly LLM evaluation through the app's own Gemini provider (GOOGLE_API_KEY
  # repository secret). A scheduled run without the key FAILS loudly: a green
  # nightly must mean the model was actually measured. The Gemini result is
  # a separate, labelled artifact (eval/GEMINI.md, eval/reports/gemini/); it never
  # overwrites the published DeepSeek headline numbers in eval/REPORT.md.
  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      OPENCODE_AUTH_JSON: ${{ secrets.OPENCODE_AUTH_JSON }}
    steps:
      - name: Require model key
        run: |
          if [ -z "$GOOGLE_API_KEY" ]; then
            echo "::error::GOOGLE_API_KEY repository secret is not set. The nightly LLM evaluation cannot run, so this job fails instead of reporting success. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Seed embedded Postgres
        run: npm run db:seed
      - name: Gemini evaluation (dev + heldout + paraphrase, LLM engine, strict)
        env:
          EVAL_LLM_BACKEND: gemini
        run: npx tsx eval/runner.ts --matrix --strict
      # Optional alternative: refresh the published DeepSeek matrix via opencode.
      # Runs only when OPENCODE_AUTH_JSON is set; its absence is not a failure
      # because the Gemini step above is the required nightly check.
      - name: Optional opencode matrix (published DeepSeek numbers)
        if: env.OPENCODE_AUTH_JSON != ''
        run: |
          mkdir -p "$HOME/.local/share/opencode"
          printf '%s' "$OPENCODE_AUTH_JSON" > "$HOME/.local/share/opencode/auth.json"
          npx tsx eval/runner.ts --matrix --strict
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-eval
          path: |
            eval/reports/**
            eval/GEMINI.md
            eval/REPORT.md
            eval/CALIBRATION.md
      - name: Commit refreshed reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eval/reports eval/GEMINI.md eval/REPORT.md eval/CALIBRATION.md
          if git diff --cached --quiet; then
            echo "no report changes"
          else
            git commit -m "Nightly eval (Gemini + optional opencode matrix)"
            git push
          fi
