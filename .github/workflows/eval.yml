name: eval
on:
  push:
    paths: ['lib/**', 'db/**', 'eval/**', 'scripts/**']
  pull_request:
    paths: ['lib/**', 'db/**', 'eval/**', 'scripts/**']
  schedule: [{ cron: '0 6 * * *' }]
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run db:seed
      - run: npx vitest run
      # Strict gates only when an LLM key is configured; otherwise regression mode
      - run: npx tsx eval/runner.ts ${{ secrets.LLM_API_KEY != '' && '--strict' || '' }}
        env:
          OPENAI_API_KEY: ${{ secrets.LLM_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval/REPORT.md
